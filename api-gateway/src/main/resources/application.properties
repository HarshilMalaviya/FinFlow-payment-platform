spring.application.name=demo
# Server
server.port=8081

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/finflow_users
spring.datasource.username=root
spring.datasource.password=harshil
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
app.jwt.secret=finflow-super-secret-key-must-be-at-least-256-bits-long-for-hs256
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Tell gateway where transaction-service lives
services.transaction-url=http://localhost:8082


# Transaction Service Route
spring.cloud.gateway.routes[0].id=transaction-service
spring.cloud.gateway.routes[0].uri=http://localhost:8082
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/transactions/**,/api/v1/wallet/**

# Notification Service Route
spring.cloud.gateway.routes[1].id=notification-service
spring.cloud.gateway.routes[1].uri=http://localhost:8083
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/notifications/**

# Public Paths
public-paths[0]=/api/v1/auth/register
public-paths[1]=/api/v1/auth/login
public-paths[2]=/actuator/health

spring.main.allow-bean-definition-overriding=true
spring.main.web-application-type=reactive